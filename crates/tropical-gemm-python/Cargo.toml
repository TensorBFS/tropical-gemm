[package]
name = "tropical-gemm-python"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Python bindings for tropical matrix multiplication"

[lib]
name = "_core"
crate-type = ["cdylib"]
doc = false  # Docs conflict with tropical-gemm crate; use Python docstrings instead

[features]
default = []
cuda = ["tropical-gemm-cuda", "pyo3-dlpack"]

[dependencies]
tropical-gemm.workspace = true
tropical-gemm-cuda = { workspace = true, optional = true }
pyo3 = { version = "0.28", features = ["extension-module"] }
numpy = "0.28"
pyo3-dlpack = { git = "https://github.com/isPANN/pyo3-dlpack", tag = "v0.2.0", optional = true }
